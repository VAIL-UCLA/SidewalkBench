name: Cosmos3-Official
goal_type: goal_less
image_resolution:
- 288
- 512
context_size: 1
input_fps: 5.0
obs_normalize: false
camera:
  model: pinhole
  fx: 210.667
  fy: 210.667
  cx: 256.0
  cy: 144.0
  height: 0.456
inputs:
  frames:
    shape:
    - 1
    - 3
    - 1
    - 480
    - 832
    dtype: uint8
    description: Current RGB frame, centre-cropped and resized to the 832x480 canvas
      (encoder.onnx)
  x_vision:
    shape:
    - 1
    - 48
    - 1
    - 30
    - 52
    dtype: float32
    description: Latent state; frame 0 is the encoded current frame (denoiser.onnx)
  x_action:
    shape:
    - 1
    - 60
    - 64
    dtype: float32
    description: Action state; the first 9 channels are the av action (denoiser.onnx)
  t:
    shape:
    - 1
    dtype: float32
    description: Model timestep of the denoising step (denoiser.onnx)
outputs:
  v_vision:
    shape:
    - 1
    - 48
    - 1
    - 30
    - 52
    description: Flow velocity of the latent
  v_action:
    shape:
    - 1
    - 60
    - 64
    description: Flow velocity of the actions
note: One plan = encoder + denoising_steps UniPC steps of the denoiser. It yields
  60 per-step camera poses [t_xyz | rot6d] at 10 Hz (x right, y down, z forward; model
  metres), integrated into body poses [x_fwd, y_left, yaw] and divided by robot_scale.
  The controller receives the next num_waypoints of the current plan.
num_modes: 1
num_waypoints: 40
output_fps: 10.0
plan_horizon_s: 6.0
denoising_steps: 20
replan_interval_s: 0.4
robot_scale: null
mirror_ensemble: true
files:
- encoder.onnx
- encoder.onnx.data
- denoiser.onnx
- denoiser.onnx.data
- meta.json
- io_spec.json
controller:
  type: pd
  description: Shared benchmark PD; linear and angular velocity use waypoint 9 at
    1 s.
checkpoint_repository: UCLA-VAIL/Navigation-Model-Zoo-Public
checkpoint_revision: 297b6596125bd870fc4e761f2bda5e243a5a4d29
default_controller: pd
