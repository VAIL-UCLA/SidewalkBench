name: InternVLA-N1-DualVLN
goal_type: language
architecture: dual_system
image_resolution:
- 384
- 384
obs_normalize: false
context_size: 8
sub_systems:
  S2:
    role: high-level VLM (action / pixel-goal)
    base: Qwen2.5-VL
    output_kinds:
    - discrete_action
    - pixel_goal
  S1:
    role: low-level diffusion policy (continuous trajectory)
    triggered_by: Full S2 output latent, on every control step
    output_kinds:
    - trajectory
inputs:
  rgb:
    accepted_shapes:
    - (H, W, 3) uint8
    - (3, H, W) float [0,1] or uint8
    - (B=1, 3, H, W)
    - (T, 3, H, W)
    - (B=1, T, 3, H, W)
    description: Current RGB frame; any supplied history is reduced to its last frame
  instruction:
    dtype: str
    description: Natural-language goal; set once per episode via set_instruction()
outputs:
  trajectory:
    shape: (N, 2)
    dtype: float32
    frame: x=forward (+), y=left (+)
    unit: meters
    description: Origin plus continuous S1 waypoints, produced for every S2 output
  pixel_goal:
    shape: (2,)
    dtype: int
    description: '[row, col] in the 384x384 image'
  action:
    shape: (K,)
    dtype: int
    description: Discrete action sequence (see action_vocab)
action_vocab:
  0: STOP
  1: FORWARD
  2: TURN_LEFT
  3: TURN_RIGHT
  5: LOOK_DOWN
normalize: false
camera_intrinsic:
  fx: 386.5
  fy: 386.5
  cx: 328.9
  cy: 244.0
uses_depth: false
uses_pose: false
model_fps: null
checkpoint:
  vlm: ckpts/InternVLA-N1-DualVLN/
  depth_backbone: ckpts/depth_anything_v2_metric_hypersim_vits.pth
inference_pipeline: always_s1
num_waypoints: 33
prediction_horizon_s: 2.0
trajectory_includes_origin: true
prediction_timing_note: Benchmark convention for untimed S1 spatial paths; preserves
  the historical PD divisor of 1 s.

